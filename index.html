<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17483e">
  <title>Dhara Creations — Connect With Us</title>
  <style>
    :root { --cream:#fff9ee; --green:#17483e; --teal:#116f73; --orange:#d86d1d; --wine:#7e2437; --gold:#c79232; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--green); font-family:Georgia, 'Times New Roman', serif; background:radial-gradient(circle at 15% 10%, #fffdf8 0 18%, transparent 19%), var(--cream); }
    main { width:min(100%, 480px); text-align:center; padding:42px 28px 32px; border:1.5px solid #c9a964; border-radius:20px; background:#fffdf8; box-shadow:0 12px 35px #17483e24; position:relative; overflow:hidden; }
    main:before, main:after { content:'✿'; position:absolute; font-size:62px; color:var(--orange); opacity:.18; }
    main:before { top:-16px; left:14px; } main:after { right:14px; bottom:-23px; }
    .eyebrow { margin:0 0 12px; font:600 13px/1.2 Arial, sans-serif; letter-spacing:2px; color:var(--orange); text-transform:uppercase; }
    h1 { margin:0; font-size:38px; line-height:1.06; font-weight:600; }
    .line { margin:18px auto 20px; width:110px; height:3px; border-radius:5px; background:linear-gradient(90deg,var(--wine),var(--gold),var(--teal)); }
    p { margin:0 auto 28px; max-width:330px; font-size:18px; line-height:1.45; }
    a { display:block; width:100%; margin:14px 0; padding:16px 18px; border-radius:12px; color:#fff; font:700 16px/1.2 Arial, sans-serif; text-decoration:none; box-shadow:0 4px 0 #0002; transition:transform .15s ease, box-shadow .15s ease; }
    a:active { transform:translateY(3px); box-shadow:0 1px 0 #0002; }
    .whatsapp { background:#1e8f53; } .instagram { background:linear-gradient(135deg,#833ab4,#d62976,#f77737,#feda75); }
    footer { margin-top:26px; color:var(--wine); font:italic 15px/1.4 Georgia, serif; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Handmade with heart</p>
    <h1>Dhara Creations</h1>
    <div class="line"></div>
    <p>Connect with our community and follow our sustainable, handmade creations.</p>
    <a class="whatsapp" href="https://chat.whatsapp.com/F8gCyb1pgZ9LVhmsVHokDd">Join our WhatsApp Community</a>
    <a class="instagram" href="https://instagram.com/dhara_creations7">Follow us on Instagram</a>
    <footer>Rooted in Nature, Made with Love</footer>
  </main>
</body>
</html>
